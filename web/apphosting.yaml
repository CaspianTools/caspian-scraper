# Firebase App Hosting backend config.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets referenced here must be created in Google Secret Manager and
# granted to the App Hosting backend service account. See web/README.md
# for one-time setup steps.

runConfig:
  minInstances: 1
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase Admin SDK service-account credentials.
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME

  # Firebase client SDK config (public, baked into the bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # Optional: name of a dedicated Firestore database (e.g. "scraper").
  # Leave the secret unset to use the project's default DB.
  - variable: FIRESTORE_DATABASE_ID
    secret: FIRESTORE_DATABASE_ID
    availability:
      - RUNTIME

  # Optional: GitHub fine-grained PAT with Actions:read+write on the
  # caspian-scraper repo. When set, "Run scrape now" fires a
  # workflow_dispatch immediately (~1 min latency) instead of waiting
  # for the next 15-minute cron tick. Without this, queued requests
  # still run, just slower.
  - variable: GH_DISPATCH_TOKEN
    secret: GH_DISPATCH_TOKEN
    availability:
      - RUNTIME
