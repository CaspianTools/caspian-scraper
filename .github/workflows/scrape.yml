name: HSE scrape

on:
  schedule:
    - cron: "30 4 * * *"      # 04:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write              # required to push docs/data.json back to main

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          ENTIRELYSAFE_API_KEY: ${{ secrets.ENTIRELYSAFE_API_KEY }}
        run: python scrape.py

      - name: Commit dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no dashboard changes to commit"
          else
            git commit -m "scraper: update dashboard data [skip ci]"
            git push
          fi
